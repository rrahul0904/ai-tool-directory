name: RE-339 P1 isolated contract verification
on:
  push:
    branches: [re339-p1-catalog-contracts]
    paths:
      - '.bootstrap/re339-p1.tgz'
      - '.github/workflows/re339-extract.yml'
  pull_request:
    paths:
      - 'src/lib/ecosystem/**'
      - 'supabase/migrations/002_ecosystem_catalog_p1.sql'
      - 'tests/ecosystem-catalog.test.mjs'
      - '.github/workflows/re339-extract.yml'
permissions:
  contents: write
jobs:
  domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and expand checksum-pinned candidate when present
        run: |
          if [ -f .bootstrap/re339-p1.tgz ]; then
            echo "5cff8fdb8d936882ae2126b3c3bae6351f5769f7388d70a04d085f6ff2014886  .bootstrap/re339-p1.tgz" | sha256sum -c -
            tar --no-same-owner -xzf .bootstrap/re339-p1.tgz
          fi
      - name: Verify synthetic P1 contracts without DB, network, or source execution
        run: node --experimental-strip-types --test tests/ecosystem-catalog.test.mjs
      - name: Publish only source/data files to the isolated branch
        if: github.event_name == 'push'
        run: |
          if [ -f .bootstrap/re339-p1.tgz ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git rm .bootstrap/re339-p1.tgz
            git add src/lib/ecosystem/catalog.ts supabase/migrations/002_ecosystem_catalog_p1.sql tests/ecosystem-catalog.test.mjs docs/research/RE-339-claude-ecosystem-intelligence.md
            git commit -m "feat(re339): publish P1 catalog contracts, proposed SQL and synthetic tests"
            git push origin HEAD:re339-p1-catalog-contracts
          fi
