name: Bootstrap verified source

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/source.part*'
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconstruct and verify candidate source
        shell: bash
        run: |
          cat .bootstrap/source.part00 .bootstrap/source.part01 .bootstrap/source.part02 .bootstrap/source.part03 .bootstrap/source.part04 > /tmp/source.b64
          base64 --decode /tmp/source.b64 > /tmp/source.zip
          echo "e98af7dab91f2b1c734527a641959ea27309abef1f93b9701499080549f095a4  /tmp/source.zip" | sha256sum -c -
          unzip -tq /tmp/source.zip
          unzip -oq /tmp/source.zip -d .
      - name: Install dependencies and generate lockfile
        run: npm install --no-audit --no-fund
      - name: Verify release candidate
        run: npm run verify
      - name: Publish verified source
        shell: bash
        run: |
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish verified end-to-end SignalIndex directory"
          git push origin HEAD:main
